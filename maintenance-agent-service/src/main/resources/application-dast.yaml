spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

  ai:
    openai:
      api-key: dummy-not-used-in-dast
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: dummy-not-used-in-dast

logging:
  level:
    org.springframework.ai.openai: WARN
    org.springframework.ai.chat.client: WARN
    org.springframework.ai.mcp: WARN