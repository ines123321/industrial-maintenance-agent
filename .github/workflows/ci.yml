name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-service:
    name: Build & Analyze - maintenance-agent-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance-agent-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour que Sonar calcule les nouveautés du code

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler et lancer les tests unitaires/intégration (hors tests coûteux)
        run: >
          mvn verify
          -Dtest=!MaintenanceAgentServiceApplicationTests,!AgentEvaluationTest
          -DfailIfNoTests=false

      - name: Cache de la base NVD (Dependency-Check)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-data-${{ runner.os }}-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true
      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true

      - name: Extraire les métriques SonarCloud
        working-directory: .
        run: |
          RESULT=$(curl -s "https://sonarcloud.io/api/measures/component?component=maintenance-agent-service&metricKeys=blocker_violations,critical_violations,major_violations,minor_violations")
          BLOCKER=$(echo "$RESULT" | jq -r '[.component.measures[] | select(.metric=="blocker_violations")][0].value // "0"')
          CRITICAL=$(echo "$RESULT" | jq -r '[.component.measures[] | select(.metric=="critical_violations")][0].value // "0"')
          MAJOR=$(echo "$RESULT" | jq -r '[.component.measures[] | select(.metric=="major_violations")][0].value // "0"')
          MINOR=$(echo "$RESULT" | jq -r '[.component.measures[] | select(.metric=="minor_violations")][0].value // "0"')
          CRIT_TOTAL=$((BLOCKER + CRITICAL))
          bash scripts/update-security-json.sh "SonarQube" "SAST" "$CRIT_TOTAL" "$MAJOR" "$MINOR" 0 "PASS"

      - name: Extraire les métriques Dependency-Check
        working-directory: .
        run: |
          FICHIER="maintenance-agent-service/target/dependency-check-report.json"
          C=$(jq '[.dependencies[]?.vulnerabilities[]?.severity] | map(select(.=="CRITICAL")) | length' "$FICHIER")
          H=$(jq '[.dependencies[]?.vulnerabilities[]?.severity] | map(select(.=="HIGH")) | length' "$FICHIER")
          M=$(jq '[.dependencies[]?.vulnerabilities[]?.severity] | map(select(.=="MEDIUM")) | length' "$FICHIER")
          L=$(jq '[.dependencies[]?.vulnerabilities[]?.severity] | map(select(.=="LOW")) | length' "$FICHIER")
          bash scripts/update-security-json.sh "Dependency-Check" "SAST" "$C" "$H" "$M" "$L" "PASS"

      - name: Committer security.json (Sonar + Dependency-Check)
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/security.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "chore: update security.json [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push refusé, nouvelle tentative dans quelques secondes..."
              sleep $((RANDOM % 5 + 2))
            done
          fi
      
      - name: Extraire et committer les résultats de tests (agent-service)
        if: always()
        working-directory: .
        run: |
          DOSSIER="maintenance-agent-service/target/surefire-reports"
          TOTAL=$(grep -ohP 'tests="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          FAILURES=$(grep -ohP 'failures="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          ERRORS=$(grep -ohP 'errors="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          SKIPPED=$(grep -ohP 'skipped="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          FAILED=$((FAILURES + ERRORS))
          PASSED=$((TOTAL - FAILED - SKIPPED))

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/update-tests-json.sh "maintenance-agent-service" "$TOTAL" "$PASSED" "$FAILED" "$SKIPPED"
          git add reports/tests.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "chore: update tests.json (agent-service) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push refusé, nouvelle tentative dans quelques secondes..."
              sleep $((RANDOM % 5 + 2))
            done
          fi
  mcp-server:
    name: Build & Analyze - maintenance-mcp-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance-mcp-server

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler et lancer les tests unitaires/intégration (hors tests coûteux)
        run: >
          mvn verify
          -Dtest=!MaintenanceMcpServerApplicationTests
          -DfailIfNoTests=false

      - name: Cache de la base NVD (Dependency-Check)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-data-${{ runner.os }}-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true

      - name: Extraire et committer les résultats de tests (mcp-server)
        if: always()
        working-directory: .
        run: |
          DOSSIER="maintenance-mcp-server/target/surefire-reports"
          TOTAL=$(grep -ohP 'tests="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          FAILURES=$(grep -ohP 'failures="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          ERRORS=$(grep -ohP 'errors="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          SKIPPED=$(grep -ohP 'skipped="\K[0-9]+' "$DOSSIER"/TEST-*.xml 2>/dev/null | awk '{s+=$1} END{print s+0}')
          FAILED=$((FAILURES + ERRORS))
          PASSED=$((TOTAL - FAILED - SKIPPED))

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/update-tests-json.sh "maintenance-mcp-server" "$TOTAL" "$PASSED" "$FAILED" "$SKIPPED"
          git add reports/tests.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "chore: update tests.json (mcp-server) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push refusé, nouvelle tentative dans quelques secondes..."
              sleep $((RANDOM % 5 + 2))
            done
          fi