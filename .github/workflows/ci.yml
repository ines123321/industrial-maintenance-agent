name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-service:
    name: Build & Analyze - maintenance-agent-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance-agent-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour que Sonar calcule les nouveautés du code

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler et lancer les tests unitaires/intégration (hors tests coûteux)
        run: >
          mvn verify
          -Dtest=!MaintenanceAgentServiceApplicationTests,!AgentEvaluationTest
          -DfailIfNoTests=false

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true

  mcp-server:
    name: Build & Analyze - maintenance-mcp-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance-mcp-server

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler et lancer les tests unitaires/intégration (hors tests coûteux)
        run: >
          mvn verify
          -Dtest=!MaintenanceMcpServerApplicationTests
          -DfailIfNoTests=false

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true